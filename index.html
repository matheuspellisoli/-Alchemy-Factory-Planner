<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="landing.title">Alchemy Factory Planner</title>
    <meta name="description" content="Planner for Alchemy Factory: machines, belts, furnaces, fuel, fertilizer and build order." />
    <link rel="icon" type="image/png" href="static/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="landing.css?v=20261003-0430" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="index.html">
        <img src="static/brand/emblem.png" alt="" />
        <span>Alchemy Factory <b>Planner</b></span>
      </a>
      <nav class="top-links">
        <a href="tutorial.html" data-i18n-tutorial data-i18n="landing.tutorial">Ver o tutorial</a>
        <select id="languageSelect" class="language-select" data-i18n-aria="title.language" aria-label="Idioma">
          <option value="pt">🌐 PT</option>
          <option value="en">🌐 EN</option>
          <option value="es">🌐 ES</option>
        </select>
        <a class="button primary small" href="planner.html" data-planner-link data-i18n="landing.open">Abrir o planner</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <img class="hero-logo" src="static/brand/logo.png" alt="Alchemy Factory Planner" />
        <h1 data-i18n="landing.tagline">Planeje sua fábrica de alquimia do começo ao fim</h1>
        <p class="lead" data-i18n="landing.lead"></p>
        <div class="cta">
          <a class="button primary" href="planner.html" data-planner-link data-i18n="landing.open">Abrir o planner</a>
          <a class="button" href="tutorial.html" data-i18n-tutorial data-i18n="landing.tutorial">Ver o tutorial</a>
        </div>
      </section>

      <section class="features">
        <h2 data-i18n="landing.featuresTitle"></h2>
        <div class="feature-grid">
          <article><span class="feature-icon">🧮</span><h3 data-i18n="landing.f1.title"></h3><p data-i18n="landing.f1.text"></p></article>
          <article><span class="feature-icon">🔥</span><h3 data-i18n="landing.f2.title"></h3><p data-i18n="landing.f2.text"></p></article>
          <article><span class="feature-icon">🌱</span><h3 data-i18n="landing.f3.title"></h3><p data-i18n="landing.f3.text"></p></article>
          <article><span class="feature-icon">🗂</span><h3 data-i18n="landing.f4.title"></h3><p data-i18n="landing.f4.text"></p></article>
          <article><span class="feature-icon">⛓</span><h3 data-i18n="landing.f5.title"></h3><p data-i18n="landing.f5.text"></p></article>
          <article><span class="feature-icon">💾</span><h3 data-i18n="landing.f6.title"></h3><p data-i18n="landing.f6.text"></p></article>
        </div>
      </section>

      <section class="how">
        <h2 data-i18n="landing.howTitle"></h2>
        <ol class="how-steps">
          <li><b>1</b><span data-i18n="landing.step1"></span></li>
          <li><b>2</b><span data-i18n="landing.step2"></span></li>
          <li><b>3</b><span data-i18n="landing.step3"></span></li>
        </ol>
      </section>

      <section class="shots">
        <h2 data-i18n="landing.shotsTitle"></h2>
        <div class="shot-grid">
          <figure><img src="static/tutorial/geral.jpg" data-shot="geral" alt="" loading="lazy" /><figcaption data-i18n="landing.shot1"></figcaption></figure>
          <figure><img src="static/tutorial/linha.jpg" data-shot="linha" alt="" loading="lazy" /><figcaption data-i18n="landing.shot2"></figcaption></figure>
          <figure><img src="static/tutorial/bloco.jpg" data-shot="bloco" alt="" loading="lazy" /><figcaption data-i18n="landing.shot3"></figcaption></figure>
        </div>
        <div class="cta">
          <a class="button primary" href="planner.html" data-planner-link data-i18n="landing.open">Abrir o planner</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <img src="static/brand/emblem.png" alt="" />
      <p data-i18n="landing.footer"></p>
    </footer>

    <script src="i18n.js?v=20261003-0430"></script>
    <script>
      // Página inicial: aplica o idioma e leva o idioma escolhido para o planner.
      const select = document.querySelector("#languageSelect");
      function syncLanguage() {
        applyStaticTranslations();
        select.value = currentLanguage;
        document.querySelectorAll("[data-planner-link]").forEach((link) => { link.href = `planner.html?lang=${currentLanguage}`; });
        const shotDir = currentLanguage === "pt" ? "static/tutorial/" : `static/tutorial/${currentLanguage}/`;
        document.querySelectorAll("[data-shot]").forEach((img) => { img.src = `${shotDir}${img.dataset.shot}.jpg`; });
      }
      select.addEventListener("change", () => setLanguage(select.value));
      window.addEventListener("languagechange-app", syncLanguage);
      syncLanguage();
    </script>
  </body>
</html>
