<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alchemy Factory Planner</title>
    <link rel="icon" type="image/png" href="static/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="styles.css?v=20261003-1245" />
    <link rel="stylesheet" href="flow.css?v=20261003-1245" />
  </head>
  <body>
    <div class="workbench" id="workbench">
      <header class="titlebar">
        <a class="titlebar-brand" href="index.html" title="Alchemy Factory Planner">
          <img class="brand-emblem" src="static/brand/emblem.png" alt="" />
          <span class="brand-name">Alchemy Factory <b>Planner</b></span>
        </a>
        <div class="titlebar-center">
          <input id="planTitle" class="plan-name" type="text" maxlength="60" placeholder="Plano" data-i18n-placeholder="title.namePlaceholder" aria-label="Nome da fábrica" data-i18n-aria="title.nameAria" title="Clique para dar um nome à fábrica" data-i18n-title="title.nameTitle" />
        </div>
        <div class="titlebar-actions">
          <button id="exportCode" class="title-button hud-code" type="button" data-i18n="title.export" data-i18n-title="title.exportTitle">⬆ Exportar</button>
          <button id="importCode" class="title-button hud-code" type="button" data-i18n="title.import" data-i18n-title="title.importTitle">⬇ Importar</button>
          <select id="languageSelect" class="language-select" data-i18n-aria="title.language" data-i18n-title="title.language" aria-label="Idioma">
            <option value="pt">🌐 PT</option>
            <option value="en">🌐 EN</option>
            <option value="es">🌐 ES</option>
          </select>
        </div>
      </header>

      <nav class="activitybar" aria-label="Activity bar">
        <button type="button" class="activity" data-activity="factories" data-i18n-title="activity.factories" data-i18n-aria="activity.factories">🏭</button>
        <button type="button" class="activity" data-activity="explorer" data-i18n-title="activity.order" data-i18n-aria="activity.order">🗂</button>
        <button type="button" class="activity" data-activity="settings" id="settingsToggle" data-i18n-title="activity.settings" data-i18n-aria="activity.settings">⚙</button>
        <a class="activity" href="tutorial.html" target="_blank" rel="noopener" data-i18n-tutorial data-i18n-title="activity.tutorial" data-i18n-aria="activity.tutorial">❓</a>
        <span class="activity-spacer"></span>
        <button type="button" class="activity" data-activity-panel data-i18n-title="activity.panel" data-i18n-aria="activity.panel">▤</button>
      </nav>

      <aside class="sidebar">
        <section id="savedFactories" class="sidebar-view" data-view="factories" data-i18n-aria="saved.title">
          <header class="sidebar-title" data-i18n="saved.title">Fábricas salvas</header>
          <div class="saved-actions">
            <button type="button" data-saved-save data-i18n="saved.save" data-i18n-title="saved.saveTitle">💾 Salvar</button>
            <button type="button" data-saved-new data-i18n="saved.new" data-i18n-title="saved.newTitle">+ Nova</button>
          </div>
          <p class="sidebar-empty" data-saved-status></p>
          <ul class="saved-list" data-saved-list></ul>
        </section>

        <section id="flowLegend" class="sidebar-view" data-view="explorer" data-i18n-aria="order.title">
          <header class="sidebar-title" data-i18n="order.title">Ordem de montagem</header>
          <p class="sidebar-empty" data-legend-empty data-i18n="order.empty">Adicione saídas na aba Geral para ver a ordem de montagem.</p>
          <ol class="legend-list"></ol>
        </section>

        <section id="settingsPanel" class="sidebar-view" data-view="settings" data-i18n-aria="settings.title" hidden>
          <header class="sidebar-title" data-i18n="settings.title">Ajustes</header>
          <div class="sidebar-body">
            <div class="field">
              <label for="beltRate" data-i18n="settings.belt">Esteira/min</label>
              <input id="beltRate" type="number" min="1" step="1" value="60" />
            </div>

            <div class="field">
              <label for="speed" data-i18n="settings.speed">Velocidade global</label>
              <input id="speed" type="range" min="25" max="250" step="5" value="100" />
              <div class="range-readout"><span id="speedValue">100%</span></div>
            </div>

            <div class="toggles">
              <label><input id="roundMachines" type="checkbox" checked /> <span data-i18n="settings.round">Arredondar máquinas</span></label>
              <label><input id="showByproducts" type="checkbox" checked /> <span data-i18n="settings.byproducts">Mostrar sobras</span></label>
            </div>

            <div class="toolbar">
              <button id="resetPlan" type="button" data-i18n="settings.reset">Resetar</button>
              <button id="exportData" type="button" data-i18n="settings.exportJson">Exportar JSON</button>
            </div>
          </div>
        </section>
      </aside>

      <main class="editor">
        <div class="editor-tabs" role="tablist" data-i18n-aria="tabs.levelsAria">
          <div class="flow-levels" role="group" data-i18n-aria="tabs.levelsAria">
            <button type="button" data-flow-level="1" data-i18n="tabs.general" data-i18n-title="tabs.generalTitle">◇ Geral</button>
            <button type="button" data-flow-level="2" data-i18n="tabs.line" data-i18n-title="tabs.lineTitle">⛓ Linha</button>
            <span class="detail-tabs" data-detail-tabs></span>
          </div>
          <div class="editor-actions">
            <div class="flow-levels flow-layouts" role="group">
              <button type="button" data-flow-layout="clusters" data-i18n="layout.clusters" data-i18n-title="layout.clustersTitle">Clusters</button>
              <button type="button" data-flow-layout="columns" data-i18n="layout.columns" data-i18n-title="layout.columnsTitle">Colunas</button>
            </div>
          </div>
        </div>

        <div class="editor-body">
          <div id="flowStage" class="flow-stage">
            <div class="flow-world">
              <div class="flow-groups"></div>
              <svg class="flow-edges" width="1" height="1"></svg>
              <div class="flow-nodes"></div>
            </div>
            <aside id="flowDetails" class="flow-details" data-i18n-aria="details.aria"></aside>
            <div id="flowToast" class="flow-toast" role="status"></div>
          </div>

          <div class="canvas-controls">
            <div class="zoom-controls">
              <button type="button" data-canvas-action="zoom-in" data-i18n-aria="canvas.zoomIn" data-i18n-title="canvas.zoomIn">+</button>
              <button type="button" data-canvas-action="zoom-out" data-i18n-aria="canvas.zoomOut" data-i18n-title="canvas.zoomOut">-</button>
            </div>
            <div class="pan-controls">
              <button type="button" data-canvas-action="pan-up" data-i18n-aria="canvas.up" data-i18n-title="canvas.up">↑</button>
              <button type="button" data-canvas-action="pan-left" data-i18n-aria="canvas.left" data-i18n-title="canvas.left">←</button>
              <button type="button" data-canvas-action="reset-view" data-i18n-aria="canvas.center" data-i18n-title="canvas.center">⌂</button>
              <button type="button" data-canvas-action="pan-right" data-i18n-aria="canvas.right" data-i18n-title="canvas.right">→</button>
              <button type="button" data-canvas-action="pan-down" data-i18n-aria="canvas.down" data-i18n-title="canvas.down">↓</button>
            </div>
          </div>
        </div>

        <section class="panel" id="bottomPanel">
          <nav class="panel-tabs tabs" role="tablist">
            <button class="tab" data-tab="plan" type="button" role="tab" aria-selected="false" data-i18n="panel.plan">Plano</button>
            <button class="tab" data-tab="resources" type="button" role="tab" aria-selected="false" data-i18n="panel.resources">Recursos</button>
            <button class="tab" data-tab="machines" type="button" role="tab" aria-selected="false" data-i18n="panel.machines">Máquinas</button>
            <button class="tab" data-tab="recipes" type="button" role="tab" aria-selected="false" data-i18n="panel.recipes">Receitas</button>
            <button class="panel-close" type="button" data-panel-close data-i18n-title="panel.close" data-i18n-aria="panel.close" hidden>✕</button>
          </nav>
          <div id="drawerPanels" class="panel-body" hidden>
            <section id="plan" class="tab-panel">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th data-i18n="table.product">Produto</th>
                      <th data-i18n="table.recipe">Receita</th>
                      <th data-i18n="table.device">Dispositivo</th>
                      <th data-i18n="table.rate">Taxa</th>
                      <th data-i18n="table.machines">Máquinas</th>
                      <th data-i18n="table.load">Carga</th>
                    </tr>
                  </thead>
                  <tbody id="machinesBody"></tbody>
                </table>
              </div>
            </section>

            <section id="resources" class="tab-panel">
              <div class="resource-grid">
                <div>
                  <h3 data-i18n="resources.raw">Matérias-primas</h3>
                  <div id="rawList" class="stack-list"></div>
                </div>
                <div>
                  <h3 data-i18n="resources.waste">Sobras</h3>
                  <div id="wasteList" class="stack-list"></div>
                </div>
              </div>
              <div id="resourceCatalog" class="catalog-list"></div>
            </section>

            <section id="machines" class="tab-panel">
              <div id="machineCatalog" class="catalog-list"></div>
            </section>

            <section id="recipes" class="tab-panel">
              <div id="recipeList" class="recipe-list"></div>
            </section>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="status-item status-accent" id="planSubtitle"></span>
        <span class="status-item"><strong id="machineCount">0</strong> <span id="machineLabel"></span></span>
        <span class="status-item"><strong id="rawCount">0</strong> <span id="rawLabel"></span></span>
        <span class="status-item"><strong id="beltCount">0</strong> <span id="beltLabel"></span></span>
        <span class="status-spacer"></span>
        <span class="status-item" id="statusBelt"></span>
        <span class="status-item" id="statusZoom"></span>
      </footer>
    </div>

    <dialog id="planCodeDialog" class="hud-card plan-code-dialog" aria-labelledby="planCodeTitle">
      <form method="dialog" class="plan-code-form">
        <header>
          <h2 id="planCodeTitle"></h2>
          <button id="planCodeClose" type="button" data-i18n-aria="dialog.close" data-i18n-title="dialog.close">✕</button>
        </header>
        <p id="planCodeHint" class="plan-code-hint"></p>
        <textarea id="planCodeText" rows="6" spellcheck="false" data-i18n-aria="dialog.codeAria"></textarea>
        <p id="planCodeError" class="plan-code-error" role="alert"></p>
        <div class="plan-code-actions">
          <button id="planCodeCopy" type="button" data-i18n="dialog.copy">Copiar</button>
          <button id="planCodeImport" type="button" data-i18n="dialog.import">Importar</button>
        </div>
      </form>
    </dialog>

    <script src="i18n.js?v=20261003-1245"></script>
    <script src="static/data/database.js?v=20261003-1245"></script>
    <script src="icon-select.js?v=20261003-1245"></script>
    <script src="flow.js?v=20261003-1245"></script>
    <script src="app.js?v=20261003-1245"></script>
  </body>
</html>
